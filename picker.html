<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B-CAUSE — clip picker</title>
<style>
  :root{--ink:#171a21;--muted:#868d9d;--line:#e5e8ee;--accent:#3f43c8;--ok:#12855b;}
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#fafbfc}
  .bar{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:12px 20px}
  .bar h1{font-size:17px;margin:0 0 6px}
  .bar p{margin:0;font-size:13px;color:var(--muted)}
  .selbox{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .selbox code{background:#f2f3f7;border:1px solid var(--line);border-radius:7px;padding:6px 10px;
    font-size:14px;min-width:200px;display:inline-block}
  .selbox button{font-size:13px;font-weight:600;border:1px solid var(--line);background:#fff;border-radius:7px;
    padding:6px 12px;cursor:pointer}
  .selbox button:hover{border-color:var(--muted)}
  .wrap{max-width:1200px;margin:0 auto;padding:20px}
  h2.grp{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
    margin:26px 0 12px;border-top:1px solid var(--line);padding-top:16px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  @media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.grid{grid-template-columns:1fr}}
  .card{border:2px solid var(--line);border-radius:12px;overflow:hidden;background:#000;cursor:pointer;
    position:relative;transition:border-color .12s, transform .12s}
  .card:hover{transform:translateY(-2px)}
  .card.sel{border-color:var(--ok);box-shadow:0 0 0 3px rgba(18,133,91,.18)}
  .card video{width:100%;aspect-ratio:3/2;object-fit:cover;display:block;background:#000}
  .id{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.72);color:#fff;font-weight:700;
    font-size:15px;padding:3px 9px;border-radius:7px;font-variant-numeric:tabular-nums}
  .check{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;
    background:rgba(0,0,0,.5);color:#fff;display:none;align-items:center;justify-content:center;font-size:16px}
  .card.sel .check{display:flex;background:var(--ok)}
  .meta{background:#fff;padding:7px 10px;font-size:12px;color:#5a6070;border-top:1px solid var(--line)}
  .meta b{color:var(--ink)}
</style>
</head>
<body>
<div class="bar">
  <h1>B-CAUSE clip picker</h1>
  <p>Tap the clips you like. Your selection appears below — copy it and send it back, I'll rebuild the gallery from exactly those.</p>
  <div class="selbox">
    <code id="sel">(none selected)</code>
    <button onclick="copySel()">Copy</button>
    <button onclick="clearSel()">Clear</button>
    <span id="count" style="font-size:13px;color:var(--muted)"></span>
  </div>
</div>
<div class="wrap" id="wrap"></div>
<script>
const SUBJ_LABEL={animal:"Animals (cat / dog)",plushie:"Plushies",toy:"Toys (monster / robot)","action-figure":"Action figures",anime:"Anime","animal-toy":"Duck toy"};
const selected=new Set();
const vobs=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target;
  if(e.isIntersecting){if(!v.dataset.on){v.src=v.dataset.src;v.dataset.on=1}v.play().catch(()=>{})}else v.pause();}),{threshold:.25});
function updateSel(){
  const arr=[...selected].sort((a,b)=>a-b);
  document.getElementById('sel').textContent=arr.length?arr.join(', '):'(none selected)';
  document.getElementById('count').textContent=arr.length?arr.length+' selected':'';
}
function copySel(){const t=[...selected].sort((a,b)=>a-b).join(', ');navigator.clipboard&&navigator.clipboard.writeText(t);}
function clearSel(){selected.clear();document.querySelectorAll('.card.sel').forEach(c=>c.classList.remove('sel'));updateSel();}
fetch('data/picker.json',{cache:'no-store'}).then(r=>r.json()).then(items=>{
  const wrap=document.getElementById('wrap');
  const groups={};
  items.forEach(it=>{(groups[it.category]=groups[it.category]||[]).push(it)});
  Object.keys(groups).forEach(cat=>{
    const h=document.createElement('h2');h.className='grp';h.textContent=SUBJ_LABEL[cat]||cat;wrap.appendChild(h);
    const g=document.createElement('div');g.className='grid';
    groups[cat].forEach(it=>{
      const card=document.createElement('div');card.className='card';card.dataset.n=it.n;
      card.innerHTML=`<div class="id">${it.n}</div><div class="check">✓</div>
        <video muted loop playsinline preload="none" data-src="${it.video}"></video>
        <div class="meta"><b>${it.subject}</b> · ${it.file.replace('.mp4','')}</div>`;
      card.addEventListener('click',()=>{
        if(selected.has(it.n)){selected.delete(it.n);card.classList.remove('sel');}
        else{selected.add(it.n);card.classList.add('sel');}
        updateSel();
      });
      vobs.observe(card.querySelector('video'));
      g.appendChild(card);
    });
    wrap.appendChild(g);
  });
});
</script>
</body>
</html>
